<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aixelink | ACE, IDH & CLAIRA</title>
<style>
/* ===================== TOKENS: light (titanium / medical white) default, dark override ===================== */
:root{
  --bg:#e9edf2; --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.42); --solid:rgba(255,255,255,.92); --line:rgba(110,130,160,.3); --hair:rgba(255,255,255,.85);
  --text:#0b1a30; --mute:#4d6184; --ac:#0889a3; --ac-soft:rgba(10,155,181,.12); --ac-glow:rgba(10,155,181,.42);
  --vi:#5b3df5; --vi-soft:rgba(91,61,245,.1); --on-ac:#fff; --orb:rgba(60,100,150,.5);
  --m1:#ffffff; --m2:#a3abb8; --m3:#dfe4ea;
  --shadow:0 24px 60px -24px rgba(20,50,100,.3); --ease:cubic-bezier(.22,1,.36,1); --hh:64px;
  --font:"Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Sans Thai","Tahoma",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme=dark]{
  --bg:#05080f; --glass:rgba(18,28,56,.58); --glass2:rgba(18,28,56,.36); --solid:rgba(14,22,44,.94); --line:rgba(120,150,200,.22); --hair:rgba(255,255,255,.1);
  --text:#eaf0fc; --mute:#8fa2c8; --ac:#34e0f7; --ac-soft:rgba(52,224,247,.1); --ac-glow:rgba(52,224,247,.45);
  --vi:#a490ff; --vi-soft:rgba(124,92,255,.15); --on-ac:#031018; --orb:rgba(120,170,230,.45);
  --m1:#eef3fb; --m2:#566480; --m3:#a9b5cb; --shadow:0 24px 60px -24px rgba(0,0,0,.75); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
/* ---- full-page section snapping: mandatory on large screens, gentle "proximity" on touch ---- */
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;scroll-snap-type:y proximity}
@media (min-width:1025px) and (hover:hover){html{scroll-snap-type:y mandatory}}
body{margin:0;min-height:100%;color:var(--text);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 10% -5%,var(--ac-soft),transparent 70%),radial-gradient(800px 500px at 95% 18%,var(--vi-soft),transparent 70%),var(--bg);
  background-attachment:fixed;transition:background-color .5s var(--ease),color .4s}
[lang=th] body,[lang=ar] body{line-height:1.75}[lang=th] h1,[lang=th] h2{line-height:1.25!important}
[lang=ar] *{letter-spacing:0!important}                      /* never track Arabic: it breaks letter joining */
button,select{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
h1,h2,h3{margin:0;letter-spacing:-.03em}
.wrap{max-width:1220px;margin:0 auto;padding-inline:max(24px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-right))}
.snap{scroll-snap-align:start;min-height:100svh;display:flex;align-items:center;padding:calc(var(--hh) + 28px) 0 36px}
.snap>.wrap{width:100%}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.metal{background:linear-gradient(135deg,var(--m1),var(--m2) 45%,var(--m3) 62%,var(--m2));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);color:var(--ac);font-size:12.5px;font-weight:600;letter-spacing:.1em;background:var(--glass2)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.lead{color:var(--mute);font-size:clamp(16px,1.9vw,20px);max-width:660px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid transparent;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));color:var(--on-ac);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sec{background:var(--glass);border-color:var(--line);color:var(--text)}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn.pri:hover{box-shadow:0 10px 30px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-2px)}.btn.sec:hover{border-color:var(--ac)}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 11px;border-radius:999px;font-size:12.5px;background:var(--glass2);border:1px solid var(--line);color:var(--text)}
button.tag{min-height:36px;transition:.4s var(--ease)}button.tag:hover{border-color:var(--ac);color:var(--ac)}
.works{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--vi-soft);border:1px solid color-mix(in srgb,var(--vi) 45%,transparent);font-size:11.5px;color:var(--vi)}
.works em{font-style:normal;color:var(--mute)}

/* ===================== HEADER (language + theme) ===================== */
.nav{position:fixed;top:0;inset-inline:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--glass);border-bottom:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--hh);gap:14px}
.brand{font-weight:800;letter-spacing:.14em;font-size:19px;white-space:nowrap;color:var(--text)}.brand b{font-weight:800;color:var(--ac)}
.nav nav{display:flex;gap:26px;font-size:14px}.nav nav a{color:var(--mute);text-decoration:none;transition:color .3s}.nav nav a:hover{color:var(--ac)}
.ctl{display:flex;align-items:center;gap:10px}
.lang{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);color:var(--text);padding:0 12px;font-size:13px;max-width:130px}
.lang option{background:var(--bg);color:var(--text)}
.tgl{position:relative;width:64px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);padding:0;flex:none}
.tgl span{position:absolute;top:3px;inset-inline-start:3px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:linear-gradient(135deg,var(--m1),var(--m2));color:#243;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .5s var(--ease)}
.tgl[aria-pressed=true] span{transform:translateX(28px)}[dir=rtl] .tgl[aria-pressed=true] span{transform:translateX(-28px)}
.dots{position:fixed;inset-inline-end:14px;top:50%;transform:translateY(-50%);z-index:40;display:grid;gap:12px}
.dots a{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid var(--m2);transition:.4s var(--ease)}
.dots a.on{background:var(--ac);border-color:var(--ac);transform:scale(1.5);box-shadow:0 0 10px var(--ac-glow)}

/* ===================== HERO ===================== */
.hero{text-align:center}
.hero h1{font-size:clamp(34px,6vw,72px);line-height:1.04;margin:22px auto 18px;max-width:960px;font-weight:600;animation:rise 1.2s var(--ease) both}
.hero h1 span{display:block}.hero h1 span+span{font-weight:300;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.hero .lead{margin-inline:auto}
.ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:28px 0 40px}
.strip{display:grid;grid-template-columns:1fr 48px 1.15fr 48px 1fr;align-items:stretch;text-align:start}
.blk{border-radius:22px;padding:20px}
.blk h3{font-size:12px;letter-spacing:.12em;color:var(--mute);margin-bottom:12px;font-weight:600}
.blk.mid{border-color:var(--ac);box-shadow:0 0 50px var(--ac-glow),inset 0 1px 0 var(--hair)}.blk.mid h3{color:var(--ac)}.blk.mid b{font-size:22px;font-weight:600}
.arrow{align-self:center;height:2px;margin:0 6px;background:repeating-linear-gradient(90deg,var(--ac) 0 6px,transparent 6px 12px);animation:dash 1s linear infinite}
@keyframes dash{to{background-position:12px 0}}

/* ===================== DIKW (compact = accordion + bottom sheet; wide = diagram + side panel in ONE viewport) ===================== */
#architecture{padding-bottom:20px}
.arch{display:grid;gap:18px;grid-template-columns:1fr}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.side h2{font-size:clamp(26px,3.2vw,42px);line-height:1.1;font-weight:600}
.hexbox{display:none;position:relative;border-radius:30px;padding:12px;overflow:hidden}
.hexbox::before,.hexbox::after{content:"";position:absolute;width:24px;height:24px;border:2px solid var(--ac);opacity:.55;pointer-events:none}
.hexbox::before{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.hexbox::after{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.hud{position:absolute;z-index:2;top:18px;font-size:11px;letter-spacing:.14em;font-weight:600;pointer-events:none}
.hud.l{left:48px;color:var(--mute)}.hud.r{right:18px;color:var(--ac)}
svg#dikw{display:block;width:100%;height:auto;direction:ltr}
.band{fill:transparent;stroke:var(--line);stroke-width:1.2;fill-rule:evenodd;cursor:pointer;transition:fill .6s var(--ease),stroke .4s}
.band.path{fill:var(--ac-soft)}.band.on{fill:var(--ac-soft);stroke:var(--ac);stroke-width:2.2;filter:drop-shadow(0 0 14px var(--ac-glow))}
@media (hover:hover){.band:hover{fill:var(--ac-soft)}}
.badge{cursor:pointer}.badge circle{fill:var(--solid);stroke:url(#metal);stroke-width:1.6;transition:.4s}.badge text{fill:var(--text);font:700 12px var(--font);text-anchor:middle;pointer-events:none}
.badge.on circle{fill:var(--ac);stroke:var(--ac);filter:drop-shadow(0 0 8px var(--ac-glow))}.badge.on text{fill:var(--on-ac)}
.ln{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:3 5;transition:stroke .5s var(--ease)}
.ln.on{stroke:var(--ac);stroke-width:2.4;stroke-dasharray:none;filter:drop-shadow(0 0 6px var(--ac-glow))}
.amb{fill:var(--ac);opacity:.4}
.pulse{fill:#fff;stroke:var(--ac);stroke-width:2;filter:drop-shadow(0 0 7px var(--ac))}
.node{cursor:pointer;outline:none;transition:opacity .5s var(--ease)}
.has-sel .node:not(.on):not(.path){opacity:.45}
.hx{fill:var(--solid);stroke:url(#metal);stroke-width:2;transition:fill .5s var(--ease),stroke-width .3s,filter .5s var(--ease)}
.node text{fill:var(--text);font:600 12.5px var(--font);text-anchor:middle;pointer-events:none}
.node.s text{font-size:10px}
@media (hover:hover){.node:hover .hx{stroke:var(--ac)}}
.node:focus-visible .hx{stroke:var(--ac);stroke-width:3.5}
.node.path .hx{stroke:var(--ac);stroke-width:2.4;filter:drop-shadow(0 0 8px var(--ac-glow))}
.node.on .hx{fill:var(--ac-soft);stroke:var(--ac);stroke-width:3;filter:drop-shadow(0 0 16px var(--ac-glow))}
.halo{fill:none;stroke:var(--ac);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.node.on .halo{animation:halo 2.4s var(--ease) infinite}
@keyframes halo{from{transform:scale(.95);opacity:.8}to{transform:scale(1.6);opacity:0}}
.layers{display:grid;gap:10px}
.lay{border-radius:20px;overflow:hidden;transition:border-color .4s,box-shadow .5s var(--ease)}
.lay.on{border-color:var(--ac);box-shadow:0 0 30px var(--ac-glow),inset 0 1px 0 var(--hair)}
.lay-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:none;border:0;text-align:start;min-height:56px}
.lb{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--m1),var(--m3));border:1px solid var(--line);color:#1a2b46;transition:.4s}
.lay.on .lb{background:var(--ac);color:var(--on-ac);box-shadow:0 0 14px var(--ac-glow)}
.lay-h b{display:block;font-size:15px;font-weight:600;line-height:1.25}.lay-h small{color:var(--mute);font-size:12.5px;line-height:1.3;display:block}
.chev{margin-inline-start:auto;transition:transform .4s var(--ease)}.lay.open .chev{transform:rotate(180deg)}
.lay-b{display:none;padding:0 16px 14px;flex-wrap:wrap;gap:8px}.lay.open .lay-b{display:flex}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);font-weight:600;font-size:14px;transition:all .5s var(--ease)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on-ac);border-color:var(--ac);box-shadow:0 8px 24px var(--ac-glow)}
/* detail: bottom sheet in compact mode */
.detail{position:fixed;z-index:45;inset-inline:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:46svh;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transform:translateY(135%);transition:transform .6s var(--ease)}
.detail.open{transform:none}
.detail .media{display:none}
.xbtn{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);z-index:3}
.dbody{padding:20px 20px 22px;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:0}
.status{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--mute);padding-inline-end:44px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--mute);transition:.4s;flex:none}
.detail.live .status{color:var(--ac)}.detail.live .status i{background:var(--ac);box-shadow:0 0 12px var(--ac)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:600}
.crumb span{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);transition:.4s}
.crumb span.p{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.crumb span.a{background:var(--ac);color:var(--on-ac);border-color:var(--ac);box-shadow:0 0 12px var(--ac-glow)}
.dbody h3{font-size:clamp(22px,2.6vw,32px);font-weight:300;line-height:1.15}
.dsub{margin:0;color:var(--ac);font-weight:600;font-size:14px}.dbody p{margin:0;color:var(--mute);font-size:14.5px}
.label{font-size:11.5px;letter-spacing:.12em;color:var(--mute);font-weight:600;margin-top:2px}
.media{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f2447,#0a9bb5 130%)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease),opacity .6s}
.media::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,12,28,.05),rgba(5,12,28,.55))}
.media .k{position:absolute;z-index:2;inset-inline-start:14px;bottom:12px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
@media (min-width:900px) and (min-height:600px){      /* WIDE: everything inside one screen height */
  #architecture{padding-top:calc(var(--hh) + 14px);padding-bottom:14px}
  .arch{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:26px}
  .hexbox{display:block;width:min(100%,calc(100svh - var(--hh) - 40px));justify-self:center}
  .side{height:min(calc(100svh - var(--hh) - 40px),800px)}
  .layers{grid-template-columns:repeat(4,1fr);gap:8px}
  .lay-h{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;min-height:0}
  .lay-h small{display:none}.chev{display:none}.lay-b,.lay.open .lay-b{display:none}
  .detail{position:relative;inset:auto;transform:none!important;flex:1;min-height:0;max-height:none;border-radius:26px}
  .detail .media{display:block;flex:none;height:clamp(70px,14svh,140px)}
  .xbtn{display:none}
  .side .lead{display:none}@media (min-height:820px){.side .lead{display:block}}
}

/* ===================== ACE ENGINE ===================== */
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.two h2{font-size:clamp(64px,9vw,120px);font-weight:300;line-height:.95;letter-spacing:-.04em;margin:16px 0 6px}
.two .sub{font-size:clamp(15px,1.8vw,20px);font-weight:600;letter-spacing:.14em;color:var(--ac);margin:0 0 16px}
.engine{position:relative;aspect-ratio:1;width:min(100%,520px);margin-inline:auto}
.engine svg{width:100%;height:100%}
.eo{fill:none;stroke:var(--orb);stroke-dasharray:2 10;stroke-linecap:round;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:spin 80s linear infinite}
.eo.b{animation-duration:55s;animation-direction:reverse}.eo.c{animation-duration:120s}
@keyframes spin{to{transform:rotate(360deg)}}
.ecore{fill:var(--solid);stroke:url(#metal2);stroke-width:2.5;filter:drop-shadow(0 0 26px var(--ac-glow))}
.etxt{fill:var(--text);font:200 54px var(--font);text-anchor:middle;letter-spacing:.04em}
.esub{fill:var(--ac);font:700 8.5px var(--font);text-anchor:middle;letter-spacing:.18em}
.etag{position:absolute;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--solid);border:1px solid var(--line);box-shadow:0 12px 26px -12px rgba(10,30,70,.4)}
.etag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);margin-inline-end:8px}
.ints{margin-top:22px}.ints .label{margin-bottom:8px}

/* ===================== IDH (3D, metallic, glass) ===================== */
.idh-wrap{position:relative;padding:2px;border-radius:40px;background:linear-gradient(135deg,var(--m1),var(--m2) 30%,var(--m3) 55%,var(--m2) 80%,var(--m1));box-shadow:0 60px 100px -34px rgba(8,30,70,.5),0 18px 36px -14px rgba(8,30,70,.3)}
.idh-wrap::before{content:"";position:absolute;inset:8% 6% -6%;background:radial-gradient(closest-side,var(--ac-glow),transparent);filter:blur(50px);opacity:.6;z-index:-1}
.idh-card{position:relative;border-radius:38px;padding:40px 44px;display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;background:linear-gradient(160deg,var(--glass),var(--glass2));backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 1px 0 var(--hair),inset 0 0 80px var(--ac-soft)}
.idh-card::before{content:"";position:absolute;inset:10px;border-radius:30px;border:1px solid var(--line);pointer-events:none}
.idh-card h2{font-size:clamp(56px,8.5vw,104px);font-weight:300;line-height:.9;letter-spacing:-.04em;margin:14px 0 6px}
.idh-card .sub{font-size:clamp(17px,2vw,22px);font-weight:300;color:var(--mute);margin:0 0 14px}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 14px}
.cbox{border-radius:20px;padding:14px 16px;background:var(--solid);border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(10,30,70,.35)}
.cbox b{display:block;font-size:24px;font-weight:300;letter-spacing:-.02em}.cbox span{font-size:13px;color:var(--mute)}
.cbox.net{border-color:var(--ac);box-shadow:0 0 28px var(--ac-glow)}.cbox.net b{color:var(--ac)}
.stage3d{perspective:1200px;touch-action:pan-y}.tilt{transform-style:preserve-3d;transition:transform .7s var(--ease)}
.float{position:relative;aspect-ratio:1/.8;display:grid;place-items:center;transform-style:preserve-3d;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.float .sh{position:absolute;inset-inline:12%;bottom:6%;height:14%;border-radius:50%;background:rgba(5,20,50,.45);filter:blur(22px);transform:translateZ(-60px)}
.float svg{position:relative;width:100%;transform:translateZ(40px);filter:drop-shadow(0 28px 22px rgba(10,30,60,.35))}
.fchip{position:absolute;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;background:var(--solid);border:1px solid var(--line);box-shadow:0 14px 30px -10px rgba(10,30,70,.4);transform:translateZ(90px);white-space:nowrap}
.fchip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);margin-inline-end:7px}

/* ===================== CLAIRA ===================== */
.phone{width:min(330px,100%);margin-inline:auto;padding:2px;border-radius:40px;background:linear-gradient(135deg,var(--m1),var(--m2),var(--m3),var(--m2));box-shadow:0 50px 90px -30px rgba(8,30,70,.5)}
.phone>div{border-radius:38px;padding:20px 18px 22px;background:linear-gradient(170deg,var(--solid),var(--glass));min-height:430px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 60px var(--ac-soft)}
.ph-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;letter-spacing:.14em;font-size:13px}
.ph-h small{color:var(--ac);font-size:11px;letter-spacing:.08em;font-weight:600}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:64px}
.wave span{width:4px;height:8px;border-radius:3px;background:var(--ac);opacity:.5;transition:opacity .3s}
.wave.on span{opacity:1;animation:bar 1s ease-in-out infinite}
@keyframes bar{50%{height:52px}}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;min-height:20px;opacity:0;transform:translateY(8px);transition:.5s var(--ease)}
.bub.show{opacity:1;transform:none}
.bub.u{align-self:flex-end;background:var(--ac);color:var(--on-ac);border-end-end-radius:6px}
.bub.a{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-end-start-radius:6px}
.mic{margin:auto auto 0;width:56px;height:56px;border-radius:50%;border:1px solid var(--ac);background:var(--ac-soft);box-shadow:0 0 26px var(--ac-glow);font-size:22px}
.note{text-align:center;font-size:11px;color:var(--mute)}
.feat{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.feat .tag{font-size:14px;padding:8px 16px;border-color:color-mix(in srgb,var(--ac) 40%,transparent)}

/* ===================== PRODUCTS ===================== */
.sec-head{max-width:740px;margin-bottom:26px}.sec-head h2{font-size:clamp(28px,4vw,48px);line-height:1.1;font-weight:600;margin-bottom:10px}
.cat{display:flex;align-items:center;gap:14px;margin:26px 0 14px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ac)}
.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{--mx:50%;--my:0%;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty2,0px));display:flex;flex-direction:column;border-radius:22px;overflow:hidden;transition:transform .6s var(--ease),border-color .4s}
@media (hover:hover){.card:hover{--ty2:-5px;border-color:var(--ac)}.card:hover .media img{transform:scale(1.06)}}
.card .media{aspect-ratio:16/7.5}
.card .body{position:relative;padding:16px 18px 16px;display:flex;flex-direction:column;gap:6px;flex:1;background:radial-gradient(240px circle at var(--mx) var(--my),var(--ac-soft),transparent 70%)}
.card h3{font-size:19px;font-weight:600}.card p{margin:0;color:var(--mute);font-size:14px;flex:1}
.card .view{align-self:flex-start;padding:0;min-height:40px;background:none;border:0;color:var(--ac);font-weight:600}
footer{scroll-snap-align:end;padding:34px 0 40px;border-top:1px solid var(--line);color:var(--mute);font-size:13.5px;text-align:center}


/* light theme: big product names used a white-to-grey metallic gradient that vanished on white. Use a deep navy-to-teal one instead */
:root:not([data-theme=dark]) .metal{background:linear-gradient(135deg,#071327 5%,#0a8aa4 55%,#12335e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 span+span{font-weight:400}

/* ===================== FUN LAYER ===================== */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.glow{position:fixed;left:var(--px,50%);top:var(--py,28%);width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(closest-side,var(--ac-glow),transparent);opacity:.22;transform:translate(-50%,-50%);transition:left .7s var(--ease),top .7s var(--ease)}
.btn{translate:var(--tx,0) var(--ty,0)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
.spark{fill:var(--ac);animation:spark .8s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.tour{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--ac);background:var(--ac-soft);color:var(--ac);font-weight:700;transition:all .5s var(--ease)}
.tour:hover{box-shadow:0 8px 26px var(--ac-glow);transform:translateY(-2px)}
.tour.on{background:var(--ac);color:var(--on-ac);box-shadow:0 0 28px var(--ac-glow)}
.tour.on #tico{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.engine{cursor:pointer;-webkit-user-select:none;user-select:none}
.engine.boost .eo{animation-duration:1.6s!important}
.engine.boost .ecore{filter:drop-shadow(0 0 60px var(--ac))}
.engine.boost .etag{animation:pop .6s var(--ease)}@keyframes pop{40%{transform:scale(1.18) translateX(var(--tw,0))}}
.engine .etag[style*="left:50%"]{--tw:-50%}
.hint{position:absolute;bottom:-30px;inset-inline:0;text-align:center;font-size:12.5px;color:var(--mute)}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1100px){.nav nav{display:none}}
@media (max-width:1024px){
  .two,.idh-card{grid-template-columns:1fr}.idh-card{padding:34px 26px}.stage3d{max-width:460px;margin:0 auto}.deck{grid-template-columns:repeat(2,1fr)}

  .conn{grid-template-columns:1fr}.idh-wrap{border-radius:30px}.idh-card{border-radius:28px;padding:26px 16px}.idh-card::before{border-radius:20px}
  .deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin-inline:-16px;padding:0 16px 14px;scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}.card{flex:0 0 80%;max-width:330px;scroll-snap-align:center}
  .lang{max-width:96px;padding:0 8px}.tgl{width:58px}.tgl[aria-pressed=true] span{transform:translateX(22px)}[dir=rtl] .tgl[aria-pressed=true] span{transform:translateX(-22px)}
  .brand{letter-spacing:.2em;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

Lwd:['CLAIRA, the speech-activated clinical AI assistant, plugs into any hospital software.',"CLAIRA, l'assistant clinique IA à commande vocale, se branche sur n'importe quel logiciel hospitalier.",'CLAIRA، المساعد السريري الذكي المُفعّل بالصوت، يندمج مع أي برنامج في المستشفى.','CLAIRA, der sprachgesteuerte klinische KI-Assistent, lässt sich in jede Krankenhaussoftware einbinden.','CLAIRA, de spraakgestuurde klinische AI-assistent, koppelt aan elke ziekenhuissoftware.','CLAIRA ผู้ช่วย AI ทางคลินิกที่สั่งงานด้วยเสียง เชื่อมต่อกับซอฟต์แวร์โรงพยาบาลได้ทุกระบบ'],
d_idh:['Bedside hub that captures, forwards and stores vitals in real time. Connects up to 6 distinct types of medical devices at once (e.g. bedside monitors, ventilators); network devices like infusion pumps are unlimited via IP streams.',
'Hub de chevet qui capte, transmet et stocke les constantes en temps réel. Connecte jusqu\'à 6 types distincts de dispositifs médicaux simultanément (moniteurs, ventilateurs) ; les appareils réseau comme les pompes à perfusion sont illimités via flux IP.',
'محور عند سرير المريض يلتقط العلامات الحيوية ويحوّلها ويخزّنها لحظياً. يتصل بما يصل إلى 6 أنواع مختلفة من الأجهزة الطبية في وقت واحد (مثل أجهزة المراقبة وأجهزة التنفس)، أما الأجهزة الشبكية كمضخات التسريب فغير محدودة العدد عبر تدفقات IP.',
'Hub am Krankenbett, der Vitaldaten in Echtzeit erfasst, weiterleitet und speichert. Verbindet gleichzeitig bis zu 6 verschiedene Gerätetypen (z. B. Monitore, Beatmungsgeräte); Netzwerkgeräte wie Infusionspumpen sind per IP-Stream unbegrenzt.',
'Hub aan het bed die vitale waarden realtime vastlegt, doorstuurt en opslaat. Koppelt tot 6 verschillende soorten medische apparaten tegelijk (bijv. monitoren, beademingsapparaten); netwerkapparaten zoals infuuspompen zijn onbeperkt via IP-streams.',
'ฮับข้างเตียงที่เก็บ ส่งต่อ และจัดเก็บสัญญาณชีพแบบเรียลไทม์ เชื่อมต่ออุปกรณ์การแพทย์ได้พร้อมกันสูงสุด 6 ประเภท (เช่น เครื่องติดตามสัญญาณชีพ เครื่องช่วยหายใจ) ส่วนอุปกรณ์เครือข่ายอย่างปั๊มให้สารน้ำเชื่อมต่อผ่านสตรีม IP ได้ไม่จำกัดจำนวน'],
d_ace:['The core care software engine that unifies, processes and optimizes real-time data as plug-and-play middleware.','Le moteur logiciel de soins qui unifie, traite et optimise les données en temps réel, en middleware plug-and-play.','المحرك البرمجي الأساسي للرعاية الذي يوحّد البيانات اللحظية ويعالجها ويحسّنها كبرمجيات وسيطة جاهزة للتوصيل.','Die zentrale Software-Engine der Versorgung: vereinheitlicht, verarbeitet und optimiert Echtzeitdaten als Plug-and-play-Middleware.','De kernsoftware-engine voor zorg die realtimedata bundelt, verwerkt en optimaliseert als plug-and-play middleware.','เอนจินซอฟต์แวร์หลักด้านการดูแลที่รวม ประมวลผล และปรับให้เหมาะสมกับข้อมูลเรียลไทม์ ในรูปแบบมิดเดิลแวร์พร้อมใช้งาน'],
d_icu:['Specialized clinical workflow for high-acuity ICU environments.','Flux de travail clinique spécialisé pour les unités de soins intensifs à forte acuité.','مسار عمل سريري متخصص لبيئات العناية المركزة عالية الحدة.','Spezialisierter klinischer Workflow für Intensivstationen mit hohem Schweregrad.','Gespecialiseerde klinische workflow voor hoogacute IC-omgevingen.','เวิร์กโฟลว์ทางคลินิกเฉพาะทางสำหรับ ICU ที่มีผู้ป่วยวิกฤต'],

d_cla:['A 24/7/365 speech-activated clinical AI assistant for doctors and nurses, as a universal plug-in for any hospital software.','Assistant clinique IA à commande vocale 24h/24, 7j/7, 365j/an pour médecins et infirmiers, plug-in universel pour tout logiciel hospitalier.','مساعد سريري ذكي يعمل بالصوت على مدار الساعة طوال أيام السنة للأطباء والممرضين، وإضافة شاملة لأي برنامج في المستشفى.','Sprachgesteuerter klinischer KI-Assistent für Ärzte und Pflegekräfte, 24/7/365, als universelles Plug-in für jede Krankenhaussoftware.','Spraakgestuurde klinische AI-assistent voor artsen en verpleegkundigen, 24/7/365, als universele plug-in voor elke ziekenhuissoftware.','ผู้ช่วย AI ทางคลินิกที่สั่งงานด้วยเสียงตลอด 24/7/365 สำหรับแพทย์และพยาบาล เป็นปลั๊กอินสากลสำหรับซอฟต์แวร์โรงพยาบาลทุกระบบ'],

ace_lead:['The brain of the system. ACE unifies, processes and optimizes real-time clinical data, then powers every Aixelink application and AI module, with no rip-and-replace.',"Le cerveau du système. ACE unifie, traite et optimise les données cliniques en temps réel, puis alimente chaque application et module IA d'Aixelink, sans remplacement de l'existant.",'عقل المنظومة. يوحّد ACE البيانات السريرية اللحظية ويعالجها ويحسّنها، ثم يشغّل كل تطبيقات Aixelink ووحدات الذكاء الاصطناعي دون استبدال الأنظمة القائمة.','Das Gehirn des Systems. ACE vereinheitlicht, verarbeitet und optimiert klinische Echtzeitdaten und versorgt jede Aixelink-Anwendung und jedes KI-Modul, ganz ohne Austausch bestehender Systeme.','Het brein van het systeem. ACE bundelt, verwerkt en optimaliseert klinische realtimedata en voedt elke Aixelink-applicatie en AI-module, zonder bestaande systemen te vervangen.','สมองของระบบ ACE รวม ประมวลผล และปรับข้อมูลทางคลินิกแบบเรียลไทม์ให้เหมาะสม แล้วขับเคลื่อนทุกแอปพลิเคชันและโมดูล AI ของ Aixelink โดยไม่ต้องรื้อระบบเดิม'],

idh_sub:['Intelligent Device Hub. The data foundation at every bedside.','Intelligent Device Hub. La fondation des données à chaque chevet.','Intelligent Device Hub. أساس البيانات عند كل سرير.','Intelligent Device Hub. Das Datenfundament an jedem Krankenbett.','Intelligent Device Hub. Het datafundament aan elk bed.','Intelligent Device Hub รากฐานข้อมูลที่ทุกเตียง'],
idh_lead:['Connects up to 6 distinct types of medical devices simultaneously, such as bedside monitors and ventilators. Network-based devices like infusion pumps are not limited in quantity and connect seamlessly via IP network streams.','Connecte jusqu\'à 6 types distincts de dispositifs médicaux simultanément, comme les moniteurs de chevet et les ventilateurs. Les appareils réseau, comme les pompes à perfusion, ne sont pas limités en nombre et se connectent via des flux IP.','يتصل بما يصل إلى 6 أنواع مختلفة من الأجهزة الطبية في وقت واحد، مثل أجهزة مراقبة السرير وأجهزة التنفس. أما الأجهزة الشبكية مثل مضخات التسريب فلا يوجد حد لعددها وتتصل بسلاسة عبر تدفقات شبكة IP.','Verbindet gleichzeitig bis zu 6 verschiedene Typen medizinischer Geräte, etwa Bettmonitore und Beatmungsgeräte. Netzwerkgeräte wie Infusionspumpen sind mengenmäßig unbegrenzt und verbinden sich nahtlos über IP-Netzwerkstreams.','Koppelt tot 6 verschillende soorten medische apparaten tegelijk, zoals bedmonitoren en beademingsapparaten. Netwerkapparaten zoals infuuspompen zijn onbeperkt in aantal en koppelen naadloos via IP-netwerkstreams.','เชื่อมต่ออุปกรณ์การแพทย์ได้พร้อมกันสูงสุด 6 ประเภท เช่น เครื่องติดตามสัญญาณชีพข้างเตียงและเครื่องช่วยหายใจ ส่วนอุปกรณ์เครือข่ายอย่างปั๊มให้สารน้ำไม่จำกัดจำนวน และเชื่อมต่อได้อย่างราบรื่นผ่านสตรีมเครือข่าย IP'],

const eds=k=>N[k].l==='data'?['idh>ace',...non.map(x=>'data>'+x)]:['data>'+k];
function compute(s){const r={on:new Set(),path:new Set(),lon:new Set(),lpath:new Set(),ed:new Set()};
  const l=s.type==='layer'?s.id:N[s.id].l;(s.type==='layer'?inLayer(l):[s.id]).forEach(k=>{r.on.add(k);eds(k).forEach(e=>r.ed.add(e))});
  r.lon.add(l);ORDER.slice(0,ORDER.indexOf(l)).forEach(x=>r.lpath.add(x));if(l!=='data'){r.path.add('idh');r.path.add('ace')}return r}
function select(type,id,auto){
  if(!auto&&tourT)tourOn(false);
  sel=id?{type,id}:null;const r=sel?compute(sel):{on:new Set(),path:new Set(),lon:new Set(),lpath:new Set(),ed:new Set()};
  ids.forEach(k=>{nodes[k].classList.toggle('on',r.on.has(k));nodes[k].classList.toggle('path',r.path.has(k))});
  ORDER.forEach(l=>{bands[l].classList.toggle('on',r.lon.has(l));bands[l].classList.toggle('path',r.lpath.has(l)&&!r.lon.has(l));badges[l].classList.toggle('on',r.lon.has(l))});
  Object.keys(edges).forEach(e=>edges[e].el.classList.toggle('on',r.ed.has(e)));svg.classList.toggle('has-sel',!!sel);
  pulses.forEach(p=>p.remove());pulses=[];r.ed.forEach(e=>[0,.5].forEach(b=>{const c=el('circle',{r:5,class:'pulse'});motion(c,edges[e].d,'1.3s',b+'s');pulses.push(c)}));
  if(sel&&type==='node')burst(pos[id]);
  const lay=sel?(type==='layer'?id:N[id].l):null;
  document.querySelectorAll('.lay').forEach(d=>{const on=d.dataset.l===lay;d.classList.toggle('on',on);if(on&&!wide())d.classList.add('open');d.querySelector('.lay-h').setAttribute('aria-expanded',d.classList.contains('open'))});
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',!!sel&&type==='node'&&b.dataset.k===id));
  panel();sheet()}

  if(sel.type==='layer'){const x=LK[sel.id];tt=t('L'+x+'n');s=t('L'+x+'s');d=t('L'+x+'d');tags=inLayer(sel.id).map(k=>`<button class="tag" data-k="${k}">${N[k].n.split(' · ')[0]}</button>`);im=IM[inLayer(sel.id)[0]];lab='lbl_p';w=null;
    $('stat').textContent=t('st_c')+' · '+tt.toUpperCase()}
  else{const k=sel.id,x=N[k];tt=x.n;s=t('L'+LK[x.l]+'n')+' · '+t('L'+LK[x.l]+'s');d=t('d_'+k);im=IM[k];lab='lbl_c';
    tags=(x.l==='data'?(k==='idh'?['ACE',t('s1t')]:['IDH','EMR / HIS','PACS','LIS']):['IDH','ACE']).map(v=>`<span class="tag">${v}</span>`);
    w=x.w?t(x.w):STD;$('stat').textContent=t('st_c')+' · '+x.s.join(' ').toUpperCase()}
  $('dt').textContent=tt;$('dsub').textContent=s;$('dd').textContent=d;$('dlabel').textContent=t(lab);$('dlabel').hidden=false;$('dtags').innerHTML=tags.join('');
  $('dtags').querySelectorAll('button').forEach(b=>b.onclick=()=>select('node',b.dataset.k));
  $('dworks').hidden=!w;if(w)$('dworks').innerHTML=`<em>${t('wk')}</em> ${w}`;$('dk').textContent=(LET[N[sel.type==='layer'?inLayer(sel.id)[0]:sel.id].l]+' · '+t('L'+LK[sel.type==='layer'?sel.id:N[sel.id].l]+'s')).toUpperCase();img.src=U(im)}
$('xbtn').onclick=()=>select(null);

/* ============ PRODUCT CARDS (two categories, strict order) ============ */
const WEB=[['icu','icuCare'],['or','orCare'],['ed','edCare'],['ecg','ECG'],['iv','ivCare (Careview)'],['cus','Customized Workflow']];
const MOB=[['ca','Clinical Assistant'],['cb','Code Blue'],['ivl','ivLink (Carelink)']];
function renderCards(){[['deck1',WEB,true],['deck2',MOB,false]].forEach(([box,list,link])=>{const d=$(box);d.innerHTML='';
  list.forEach(([k,name])=>{const c=document.createElement('article');c.className='card glass';
    c.innerHTML=`<div class="media"><img loading="lazy" referrerpolicy="no-referrer" alt="${name}" src="${U(IM[k])}"></div><div class="body"><h3>${name}</h3><p>${t('d_'+k)}</p><span class="works"><em>${t('wk')}</em> ${STD}</span>${link?`<button class="view">${t('view')} ↑</button>`:''}</div>`;
    c.querySelector('img').addEventListener('error',e=>e.target.style.display='none');
    if(link)c.querySelector('.view').onclick=()=>{select('node',k);$('architecture').scrollIntoView({behavior:'smooth'})};
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top-80)+'px');if(e.pointerType==='mouse'){c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*10+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*8+'deg')}});c.addEventListener('pointerleave',()=>{c.style.removeProperty('--rx');c.style.removeProperty('--ry')});d.appendChild(c)})})}

/* ============ CLAIRA LIVE DEMO (illustrative) ============ */
const wave=$('wave');for(let i=0;i<22;i++){const s=document.createElement('span');s.style.animationDelay=(i*.07)+'s';wave.appendChild(s)}
let dTimers=[],di=0;const clr=()=>{dTimers.forEach(clearTimeout);dTimers=[]},later=(f,ms)=>dTimers.push(setTimeout(f,ms));
function demo(){clr();const p=t('cd_p'+(di%2+1)),r=t('cd_r'+(di%2+1)),bu=$('bu'),ba=$('ba');bu.classList.remove('show');ba.classList.remove('show');bu.textContent='';ba.textContent='';
  $('listen').textContent=t('cd_listen');wave.classList.add('on');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){bu.textContent=p;ba.textContent=r;bu.classList.add('show');ba.classList.add('show');wave.classList.remove('on');return}
  later(()=>{bu.classList.add('show');[...p].forEach((_,i)=>later(()=>bu.textContent=p.slice(0,i+1),i*45))},500);
  const end=500+p.length*45;later(()=>{wave.classList.remove('on');$('listen').textContent='';ba.textContent=r;ba.classList.add('show')},end+500);
  later(()=>{di++;demo()},end+5200)}
$('mic').onclick=()=>{di++;demo()};

/* ============ LANGUAGE (EN default, AR switches to RTL) + THEME ============ */
function apply(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $('theme').setAttribute('aria-label',t('aria_t'));$('lang').setAttribute('aria-label','Language');
  document.querySelectorAll('#dots a').forEach((a,i)=>a.setAttribute('aria-label',t(['n_hero','n_arch','n_ace','n_hero','n_hero','n_prod'][i])+(i===3?' IDH':i===4?' CLAIRA':'')));
  renderLayers();renderCards();panel();demo()}
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('lang').value=l;try{localStorage.setItem('aixe-lang',l)}catch(e){}
  const keep=sel;apply();if(keep)select(keep.type,keep.id)}
$('lang').onchange=e=>setLang(e.target.value);
const root=document.documentElement;
function setTheme(m){root.dataset.theme=m;$('theme').setAttribute('aria-pressed',m==='dark');$('ico').textContent=m==='dark'?'☾':'☀';try{localStorage.setItem('aixe-theme',m)}catch(e){}}
try{if(localStorage.getItem('aixe-theme')==='dark')setTheme('dark')}catch(e){}
$('theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

/* ============ SECTION DOTS + VIEWPORT TRACKING ============ */
const SEC=['hero','architecture','ace','idh','claira','products'];
SEC.forEach(id=>{const a=document.createElement('a');a.href='#'+id;$('dots').appendChild(a)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#dots a').forEach((a,i)=>a.classList.toggle('on',SEC[i]===e.target.id))}}),{threshold:.55});
SEC.forEach(id=>io.observe($(id)));
new IntersectionObserver(es=>{inArch=es[0].isIntersecting;sheet()},{threshold:.3}).observe($('architecture'));
matchMedia('(min-width:900px) and (min-height:600px)').addEventListener('change',()=>{sheet();renderLayers();if(sel)select(sel.type,sel.id)});

/* ============ IDH 3D TILT ============ */
const tilt=$('tilt'),st=$('stage3d');
st.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tilt.style.transform=`rotateY(${x*22}deg) rotateX(${-y*16}deg)`});
st.addEventListener('pointerleave',()=>tilt.style.transform='');


/* ============ FUN LAYER: spark burst, DIKW tour, ACE boost, hex particles, magnetic buttons, reveal ============ */
function burst(p){for(let i=0;i<10;i++){const a=i/10*6.283,c=el('circle',{cx:p.x,cy:p.y,r:3.5,class:'spark'});c.style.setProperty('--dx',Math.cos(a)*62+'px');c.style.setProperty('--dy',Math.sin(a)*62+'px');setTimeout(()=>c.remove(),900)}}
const TOUR=['idh','ace','icu','or','ed','ecg','iv','cus','vit','flow','ent','cla','phc'];let tourT=null,ti=0;
function tourOn(on){clearInterval(tourT);tourT=null;$('tour').classList.toggle('on',on);$('tico').textContent=on?'■':'▶';$('tlab').dataset.i18n=on?'tour_x':'tour_s';$('tlab').textContent=t(on?'tour_x':'tour_s');
  if(on){const step=()=>select('node',TOUR[ti++%TOUR.length],true);step();tourT=setInterval(step,2800)}}
$('tour').onclick=()=>tourOn(!tourT);
$('ace').querySelector('.engine').addEventListener('click',function(){this.classList.add('boost');setTimeout(()=>this.classList.remove('boost'),1800)});
document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=b.getBoundingClientRect();b.style.setProperty('--tx',((e.clientX-r.left)/r.width-.5)*10+'px');b.style.setProperty('--ty',((e.clientY-r.top)/r.height-.5)*8+'px')});b.addEventListener('pointerleave',()=>{b.style.removeProperty('--tx');b.style.removeProperty('--ty')})});
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){root.style.setProperty('--px',e.clientX+'px');root.style.setProperty('--py',e.clientY+'px')}});
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.two>*,.idh-wrap,.sec-head,.strip,.cat').forEach(e=>{e.classList.add('rv');rio.observe(e)});
(function(){const c=$('fx'),x=c.getContext('2d');if(matchMedia('(prefers-reduced-motion:reduce)').matches){c.remove();return}
  let W,H,P=[],m={x:-999,y:-999};
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.round(W*H/52000)+8},()=>({x:Math.random()*W,y:Math.random()*H,r:10+Math.random()*26,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()*6,s:(Math.random()-.5)*.004}))};
  rs();addEventListener('resize',rs);addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
  (function loop(){x.clearRect(0,0,W,H);const col=getComputedStyle(root).getPropertyValue('--ac').trim()||'#0889a3';
    P.forEach(p=>{const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;if(d<150){p.x+=dx/d*1.8;p.y+=dy/d*1.8}
      p.x+=p.vx;p.y+=p.vy;p.a+=p.s;if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;
      x.strokeStyle=col;x.globalAlpha=d<190?.5:.17;x.lineWidth=1.2;x.beginPath();for(let i=0;i<6;i++){const a=p.a+i*Math.PI/3;x.lineTo(p.x+p.r*Math.cos(a),p.y+p.r*Math.sin(a))}x.closePath();x.stroke()});
    requestAnimationFrame(loop)})()})();

let saved='en';try{saved=localStorage.getItem('aixe-lang')||'en'}catch(e){}
setLang(LANGS.includes(saved)?saved:'en');
</script>
